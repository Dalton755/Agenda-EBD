<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">

</head>

<body>

<h2 id="titulo"></h2>

<input
id="professor"
placeholder="Professor">

<input
type="date"
id="data">

<button onclick="salvar()">
Salvar
</button>

<script>

const API="SUA_URL";

const params=
new URLSearchParams(
location.search
);

const id=
params.get("id");

async function salvar(){

const dados={

id:id,
professor:
document.getElementById(
"professor"
).value,

data:
document.getElementById(
"data"
).value

};

await fetch(

API,

{

method:"POST",

body:JSON.stringify({

acao:"agenda",
...dados

})

}

);

alert(
"Agendamento salvo"
);

}

</script>

</body>

</html>
